name: Rapikan database setelah edit manual

on:
  push:
    branches: [main]
    paths:
      - "docs/data/journals.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Periksa format, naikkan versi, tulis catatan perubahan
        run: |
          BEFORE="${{ github.event.before }}"
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE:docs/data/journals.json" 2>/dev/null; then
            git show "$BEFORE:docs/data/journals.json" > /tmp/prev.json
          else
            git show HEAD~1:docs/data/journals.json > /tmp/prev.json 2>/dev/null || echo "{}" > /tmp/prev.json
          fi
          python scripts/finalize_db.py --db docs/data/journals.json --prev /tmp/prev.json

      - name: Simpan hasil
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/data
            git commit -m "Rapikan database: versi baru & catatan perubahan"
            git push
          else
            echo "Tidak ada yang perlu dirapikan."
          fi
